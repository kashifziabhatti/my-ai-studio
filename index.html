<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio | TheVoxCritic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f111a',
                        darker: '#0a0b10',
                        primary: '#38ffff',
                        secondary: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f111a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(180,100%,50%,0.05) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(250,50%,30%,0.15) 0, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-bottom-color: #38ffff;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast-enter {
            animation: slideInRight 0.3s ease-out forwards;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-gray-200">

    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-40 w-full backdrop-blur-lg border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20">
                        <i class="fa-solid fa-wand-magic-sparkles text-darker text-sm font-bold"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TheVoxCritic Studio</span>
                </div>
                <div>
                    <button onclick="toggleSettings()" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 transition-colors border border-white/5 text-gray-300">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-8">
        
        <!-- Header Text -->
        <div class="text-center space-y-3 mt-4">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">AI <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">Image Generator</span></h1>
            <p class="text-gray-400 max-w-2xl mx-auto text-sm md:text-base">Apna prompt niche likhein aur behtareen AI images generate karein. Yeh tool GitHub Pages par 100% free chalega.</p>
        </div>

        <!-- Input Section -->
        <div class="glass-panel p-2 rounded-3xl relative mx-auto w-full max-w-3xl">
            <textarea id="promptInput" rows="3" class="w-full bg-transparent text-white placeholder-gray-500 rounded-2xl p-4 focus:outline-none resize-none custom-scrollbar text-lg" placeholder="A cinematic cyberpunk street with cyan neon lights, 8k resolution, highly detailed..."></textarea>
            
            <div class="flex items-center justify-between p-2 mt-2 border-t border-white/5 pt-3">
                <div class="flex items-center gap-2">
                    <select id="modelSelector" class="bg-darker border border-white/10 text-gray-300 text-sm rounded-lg focus:ring-primary focus:border-primary block p-2 outline-none">
                        <option value="free">Free AI (No Key Needed)</option>
                        <option value="gemini">Google Gemini (Imagen Paid)</option>
                        <option value="openai">ChatGPT (DALL-E 3 Paid)</option>
                    </select>
                </div>
                <button id="generateBtn" onclick="handleGenerate()" class="bg-gradient-to-r from-primary to-secondary hover:from-cyan-400 hover:to-indigo-500 text-darker font-bold py-2.5 px-6 rounded-xl transition-all transform active:scale-95 shadow-lg shadow-primary/20 flex items-center gap-2">
                    <i class="fa-solid fa-image"></i>
                    <span>Generate Image</span>
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div class="w-full max-w-4xl mx-auto mt-4">
            <div id="imageContainer" class="hidden glass-panel rounded-3xl overflow-hidden relative group aspect-square md:aspect-video flex items-center justify-center">
                <!-- Loading State -->
                <div id="loadingState" class="hidden flex-col items-center justify-center gap-4 text-gray-400 w-full h-full min-h-[400px]">
                    <span class="loader w-12 h-12"></span>
                    <p class="animate-pulse font-medium">AI aapki tasveer bana raha hai...</p>
                </div>

                <!-- Generated Image -->
                <img id="resultImage" src="" alt="Generated AI Image" class="hidden w-full h-full object-contain">
                
                <!-- Overlay Actions -->
                <div id="imageActions" class="hidden absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/80 to-transparent flex justify-end gap-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <button onclick="downloadImage()" class="bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/10 text-white rounded-xl py-2 px-4 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-download"></i>
                        <span>Download HD</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl border border-white/10 shadow-2xl overflow-hidden transform transition-all">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-white">API Settings</h3>
                    <button onclick="toggleSettings()" class="text-gray-400 hover:text-white transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Google Gemini API Key</label>
                        <div class="relative">
                            <input type="password" id="geminiKey" class="w-full bg-darker border border-white/10 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-primary" placeholder="AIzaSy...">
                            <p class="text-xs text-gray-500 mt-1">Get key from <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-primary hover:underline">Google AI Studio</a></p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">OpenAI (ChatGPT) API Key</label>
                        <div class="relative">
                            <input type="password" id="openAIKey" class="w-full bg-darker border border-white/10 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-primary" placeholder="sk-...">
                            <p class="text-xs text-gray-500 mt-1">Get key from <a href="https://platform.openai.com/api-keys" target="_blank" class="text-primary hover:underline">OpenAI Platform</a></p>
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex justify-end">
                    <button onclick="saveSettings()" class="bg-white text-darker font-bold py-2 px-6 rounded-xl hover:bg-gray-200 transition-colors">
                        Save Keys
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // Load saved keys on startup
        document.addEventListener('DOMContentLoaded', () => {
            const savedGemini = localStorage.getItem('kashif_gemini_key');
            const savedOpenAI = localStorage.getItem('kashif_openai_key');
            
            if(savedGemini) document.getElementById('geminiKey').value = savedGemini;
            if(savedOpenAI) document.getElementById('openAIKey').value = savedOpenAI;
        });

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        function saveSettings() {
            const geminiKey = document.getElementById('geminiKey').value.trim();
            const openAIKey = document.getElementById('openAIKey').value.trim();
            
            localStorage.setItem('kashif_gemini_key', geminiKey);
            localStorage.setItem('kashif_openai_key', openAIKey);
            
            toggleSettings();
            showToast("Settings saved successfully!", "success");
        }

        function showToast(message, type = "info") {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let icon = 'fa-circle-info text-blue-400';
            let border = 'border-blue-500/20';
            if (type === 'success') { icon = 'fa-circle-check text-green-400'; border = 'border-green-500/20'; }
            if (type === 'error') { icon = 'fa-circle-xmark text-red-400'; border = 'border-red-500/20'; }

            toast.className = `toast-enter glass-panel ${border} rounded-xl p-4 flex items-center gap-3 shadow-lg max-w-sm w-full`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-xl"></i>
                <p class="text-sm font-medium text-white">${message}</p>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function handleGenerate() {
            const prompt = document.getElementById('promptInput').value.trim();
            const model = document.getElementById('modelSelector').value;
            const btn = document.getElementById('generateBtn');
            const imgContainer = document.getElementById('imageContainer');
            const loadingState = document.getElementById('loadingState');
            const resultImg = document.getElementById('resultImage');
            const imageActions = document.getElementById('imageActions');

            if (!prompt) {
                showToast("Bhai, pehle image ka prompt to likhein!", "error");
                return;
            }

            // UI Loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="loader w-4 h-4 mr-2 border-2 border-darker/20 border-b-darker"></span> Generating...';
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            
            imgContainer.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            resultImg.classList.add('hidden');
            imageActions.classList.add('hidden');

            try {
                if (model === 'free') {
                    // Pollinations AI - 100% Free, no keys needed
                    const seed = Math.floor(Math.random() * 1000000);
                    const encodedPrompt = encodeURIComponent(prompt);
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true&seed=${seed}`;
                    
                    // Preload image to ensure loading spinner works perfectly
                    const response = await fetch(imageUrl);
                    if(!response.ok) throw new Error("Free AI system busy standard error.");
                    const blob = await response.blob();
                    const objectURL = URL.createObjectURL(blob);
                    
                    resultImg.src = objectURL;
                } 
                else if (model === 'gemini') {
                    const activeKey = localStorage.getItem('kashif_gemini_key');
                    if (!activeKey) {
                        throw new Error("Gemini API key missing. Settings gear icon par ja kar save karein.");
                    }
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${activeKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            instances: { prompt: prompt },
                            parameters: { sampleCount: 1 }
                        })
                    });
                    const data = await response.json();
                    if (data.predictions && data.predictions[0] && data.predictions[0].bytesBase64Encoded) {
                         resultImg.src = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    } else {
                        throw new Error(data.error?.message || "Gemini API response error. Make sure your plan supports Imagen.");
                    }
                } 
                else if (model === 'openai') {
                    const activeKey = localStorage.getItem('kashif_openai_key');
                    if (!activeKey) {
                        throw new Error("OpenAI API key missing. Settings gear icon par ja kar save karein.");
                    }
                    const response = await fetch('https://api.openai.com/v1/images/generations', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${activeKey}`
                        },
                        body: JSON.stringify({
                            model: "dall-e-3",
                            prompt: prompt,
                            n: 1,
                            size: "1024x1024",
                            response_format: "b64_json"
                        })
                    });
                    const data = await response.json();
                    if (data.data && data.data[0] && data.data[0].b64_json) {
                        resultImg.src = `data:image/png;base64,${data.data[0].b64_json}`;
                    } else {
                        throw new Error(data.error?.message || "OpenAI API response error.");
                    }
                }

                resultImg.onload = () => {
                    loadingState.classList.add('hidden');
                    loadingState.classList.remove('flex');
                    resultImg.classList.remove('hidden');
                    imageActions.classList.remove('hidden');
                    showToast("Zabardast! Image generate ho gayi.", "success");
                };

            } catch (error) {
                console.error(error);
                imgContainer.classList.add('hidden');
                showToast(error.message || "Koi masla aa gaya hai. Settings check karein.", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-image"></i><span>Generate Image</span>';
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        function downloadImage() {
            const img = document.getElementById('resultImage');
            if (!img.src) return;

            const a = document.createElement('a');
            a.href = img.src;
            a.download = `TheVoxCritic_AI_${new Date().getTime()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast("Image download start ho gayi!", "success");
        }
    </script>
</body>
</html>
